name: Meken
options:
  bundleIdPrefix: kz.unknown
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_APPROACHABLE_CONCURRENCY: NO
    DEVELOPMENT_TEAM: "8885RF248C"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MEKEN_API_BASE_URL: https://194.238.43.134
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      MEKEN_API_BASE_URL: https://194.238.43.134
packages:
  MekenCore:
    path: MekenCore
targets:
  Meken:
    type: application
    platform: iOS
    sources:
      - path: Meken
    dependencies:
      - package: MekenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.unknown.meken
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Meken/Resources/Info.plist
      properties:
        CFBundleDisplayName: Meken
        MekenAPIBaseURL: $(MEKEN_API_BASE_URL)
        NSFaceIDUsageDescription: Подтвердите, что это ваше устройство, чтобы показать код доступа к подборкам.
        NSLocalNetworkUsageDescription: Подключение к локальному тестовому серверу при проверке приложения разработчиком.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    preBuildScripts:
      - name: Validate release endpoint
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            if [ "$MEKEN_API_BASE_URL" != "https://194.238.43.134" ]; then
              echo "error: Meken Release API must be https://194.238.43.134; local overrides belong to Debug"
              exit 1
            fi
          fi
        basedOnDependencyAnalysis: false
  MekenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MekenUITests]
    dependencies:
      - target: Meken
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.unknown.meken.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Meken
schemes:
  Meken:
    build:
      targets:
        Meken: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets: [MekenUITests]
