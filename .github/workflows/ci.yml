name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: meken_test
          POSTGRES_USER: meken
          POSTGRES_PASSWORD: isolated-ci-only-password
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U meken -d meken_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install -e . --no-deps
      - run: ruff check app tests && ruff format --check app tests
      - run: pytest -q
      - run: pytest -q --cov=app --cov-report=term-missing
        env:
          MEKEN_TEST_DATABASE_URL: postgresql+asyncpg://meken:isolated-ci-only-password@localhost:5432/meken_test
          MEKEN_TEST_REDIS_URL: redis://localhost:6379/1
      - run: python -m app.migrate && alembic check
        env:
          MEKEN_DATABASE_URL: postgresql+asyncpg://meken:isolated-ci-only-password@localhost:5432/meken_test
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/MekenCore
      - run: xcodebuild -project ios/Meken.xcodeproj -scheme Meken -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGN_IDENTITY=- build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meken-api:test backend
